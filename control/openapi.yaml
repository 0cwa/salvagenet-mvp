{
  "openapi": "3.1.0",
  "info": {"title": "NodeHost MVP Host API", "version": "0.3.0"},
  "servers": [{"url": "https://{node}:7443", "variables": {"node": {"default": "100.64.0.1"}}}],
  "security": [{"controllerCapability": []}],
  "paths": {
    "/v1/status": {"get": {"operationId": "getStatus", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Status"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/v1/capabilities": {"get": {"operationId": "listCapabilities", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "array", "maxItems": 128, "items": {"$ref": "#/components/schemas/Capability"}}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/v1/profiles": {"get": {"operationId": "listProfiles", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "array", "maxItems": 32, "items": {"$ref": "#/components/schemas/Profile"}}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/v1/images": {"get": {"operationId": "listImages", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "array", "maxItems": 128, "items": {"$ref": "#/components/schemas/Image"}}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/v1/image-imports": {"post": {"operationId": "importImage", "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ImageImport"}}}}, "responses": {"202": {"$ref": "#/components/responses/AcceptedOperation"}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/v1/artifact-uploads": {"post": {"operationId": "createArtifactUpload", "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ArtifactUploadCreate"}}}}, "responses": {"201": {"description": "Created or idempotent replay", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ArtifactUpload"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}}}},
    "/v1/artifact-uploads/{id}": {
      "parameters": [{"$ref": "#/components/parameters/UploadId"}],
      "get": {"operationId": "getArtifactUpload", "responses": {"200": {"description": "Upload status", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ArtifactUpload"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}}},
      "delete": {"operationId": "cancelArtifactUpload", "description": "Idempotently cancels open staging; a completed artifact is never deleted.", "responses": {"200": {"description": "Cancelled or terminal upload", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ArtifactUpload"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}}}
    },
    "/v1/artifact-uploads/{id}/chunks/{offset}": {"parameters": [{"$ref": "#/components/parameters/UploadId"}, {"$ref": "#/components/parameters/UploadOffset"}, {"$ref": "#/components/parameters/ChunkSha256"}], "put": {"operationId": "putArtifactUploadChunk", "description": "Sequential append. Exact replay of a committed chunk is idempotent; gaps and conflicting overlap are rejected.", "requestBody": {"required": true, "content": {"application/octet-stream": {"schema": {"type": "string", "contentMediaType": "application/octet-stream", "maxLength": 1048576}}}}, "responses": {"200": {"description": "Updated upload status", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ArtifactUpload"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}}},
    "/v1/artifact-uploads/{id}/complete": {"parameters": [{"$ref": "#/components/parameters/UploadId"}], "post": {"operationId": "completeArtifactUpload", "description": "Idempotently verifies expected size and SHA-256, fsyncs staging, and atomically publishes the artifact.", "responses": {"200": {"description": "Published artifact", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Image"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}}},
    "/v1/vms": {"get": {"operationId": "listVms", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "array", "maxItems": 1, "items": {"$ref": "#/components/schemas/Vm"}}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/v1/vms/{id}": {
      "parameters": [{"$ref": "#/components/parameters/RuntimeId"}],
      "get": {"operationId": "getVm", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Vm"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}}},
      "put": {"operationId": "applyVm", "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApplyVm"}}}}, "responses": {"202": {"$ref": "#/components/responses/AcceptedOperation"}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}}},
      "delete": {"operationId": "removeVm", "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}], "responses": {"202": {"$ref": "#/components/responses/AcceptedOperation"}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}}}
    },
    "/v1/operations": {"get": {"operationId": "listOperations", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "array", "maxItems": 256, "items": {"$ref": "#/components/schemas/Operation"}}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/v1/operations/{id}": {"parameters": [{"$ref": "#/components/parameters/OperationId"}], "get": {"operationId": "getOperation", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Operation"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}}}},
    "/v1/operations/{id}/cancel": {"parameters": [{"$ref": "#/components/parameters/OperationId"}], "post": {"operationId": "cancelOperation", "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}], "responses": {"202": {"$ref": "#/components/responses/AcceptedOperation"}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}}}},
    "/v1/diagnostics": {"get": {"operationId": "getDiagnostics", "responses": {"200": {"description": "Redacted diagnostics", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Diagnostics"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}},
    "/v1/controllers/{id}": {"parameters": [{"$ref": "#/components/parameters/ControllerId"}], "delete": {"operationId": "revokeController", "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}], "responses": {"204": {"description": "Revoked"}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "409": {"$ref": "#/components/responses/Conflict"}}}},
    "/v1/vms/{id}/ssh": {"parameters": [{"$ref": "#/components/parameters/RuntimeId"}], "connect": {"operationId": "openRecoverySsh", "summary": "Open an authenticated byte stream only to the default VM's fixed recovery SSH port", "description": "At most one recovery session is active. Starts are rate limited to 6 per minute. Each direction is limited to 64 MiB, with a 30 second idle deadline and 15 minute overall deadline. EOF or cancellation in either direction closes both directions.", "responses": {"200": {"description": "Tunnel established", "content": {"application/octet-stream": {"schema": {"type": "string", "contentMediaType": "application/octet-stream"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "429": {"$ref": "#/components/responses/RateLimited"}}}}
  },
  "components": {
    "securitySchemes": {"controllerCapability": {"type": "http", "scheme": "bearer", "bearerFormat": "opaque-mvp-capability"}},
    "parameters": {
      "IdempotencyKey": {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 16, "maxLength": 200, "pattern": "^[!-~]+$"}},
      "RuntimeId": {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "const": "default"}},
      "OperationId": {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$"}},
      "ControllerId": {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$"}},
      "UploadId": {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^upload-[a-f0-9]{32}$"}},
      "UploadOffset": {"name": "offset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 0, "maximum": 68719476735}},
      "ChunkSha256": {"name": "Content-SHA256", "in": "header", "required": true, "schema": {"type": "string", "pattern": "^[a-f0-9]{64}$"}}
    },
    "responses": {
      "AcceptedOperation": {"description": "Accepted or idempotent replay", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Operation"}}}},
      "BadRequest": {"description": "Invalid request", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}},
      "Unauthorized": {"description": "Unauthorized", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}},
      "NotFound": {"description": "Not found", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}},
      "Conflict": {"description": "Idempotency, generation, upload-state, or active-session conflict", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}},
      "RateLimited": {"description": "Bounded recovery session start rate exceeded", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}}
    },
    "schemas": {
      "Problem": {"type": "object", "additionalProperties": false, "required": ["type", "title", "status", "code"], "properties": {"type": {"type": "string", "maxLength": 256}, "title": {"type": "string", "maxLength": 128}, "status": {"type": "integer", "minimum": 400, "maximum": 599}, "detail": {"type": "string", "maxLength": 512}, "code": {"type": "string", "pattern": "^[A-Z][A-Z0-9_]{0,63}$"}}},
      "Status": {"type": "object", "additionalProperties": false, "required": ["deviceId", "hostMesh", "runtime"], "properties": {"deviceId": {"type": "string", "maxLength": 128}, "hostMesh": {"type": "string", "maxLength": 64}, "runtime": {"type": "string", "maxLength": 64}}},
      "Capability": {"type": "object", "additionalProperties": false, "required": ["id", "supported"], "properties": {"id": {"type": "string", "pattern": "^[a-z][a-z0-9.-]{0,63}$"}, "supported": {"type": "boolean"}, "detail": {"type": ["string", "null"], "maxLength": 256}}},
      "Profile": {"type": "object", "additionalProperties": false, "required": ["id", "version", "bootKind"], "properties": {"id": {"type": "string", "pattern": "^[a-z0-9][a-z0-9-]{0,63}$"}, "version": {"type": "integer", "minimum": 1}, "bootKind": {"enum": ["DIRECT_KERNEL", "UEFI"]}}},
      "Image": {"type": "object", "additionalProperties": false, "required": ["id", "sha256", "sizeBytes"], "properties": {"id": {"type": "string", "pattern": "^[a-z0-9][a-z0-9.-]{0,127}$"}, "sha256": {"type": "string", "pattern": "^[a-f0-9]{64}$"}, "sizeBytes": {"type": "integer", "minimum": 1, "maximum": 68719476736}}},
      "ImageImport": {"type": "object", "additionalProperties": false, "required": ["sourceUrl", "sha256", "expectedSizeBytes"], "properties": {"sourceUrl": {"type": "string", "format": "uri", "pattern": "^https://", "maxLength": 2048}, "sha256": {"type": "string", "pattern": "^[a-f0-9]{64}$"}, "expectedSizeBytes": {"type": "integer", "minimum": 1, "maximum": 68719476736}}},
      "ArtifactUploadCreate": {"type": "object", "additionalProperties": false, "required": ["artifactId", "sha256", "expectedSizeBytes"], "properties": {"artifactId": {"type": "string", "pattern": "^[a-z0-9][a-z0-9.-]{0,127}$"}, "sha256": {"type": "string", "pattern": "^[a-f0-9]{64}$"}, "expectedSizeBytes": {"type": "integer", "minimum": 1, "maximum": 68719476736}}},
      "ArtifactUpload": {"type": "object", "additionalProperties": false, "required": ["id", "artifactId", "sha256", "expectedSizeBytes", "committedBytes", "state"], "properties": {"id": {"type": "string", "pattern": "^upload-[a-f0-9]{32}$"}, "artifactId": {"type": "string", "pattern": "^[a-z0-9][a-z0-9.-]{0,127}$"}, "sha256": {"type": "string", "pattern": "^[a-f0-9]{64}$"}, "expectedSizeBytes": {"type": "integer", "minimum": 1, "maximum": 68719476736}, "committedBytes": {"type": "integer", "minimum": 0, "maximum": 68719476736}, "state": {"enum": ["OPEN", "COMPLETED", "CANCELLED"]}}},
      "Vm": {"type": "object", "additionalProperties": false, "required": ["id", "generation", "desiredState", "profileId", "memoryMiB", "vcpus", "dataDiskGiB"], "properties": {"id": {"type": "string", "const": "default"}, "generation": {"type": "integer", "minimum": 1}, "desiredState": {"enum": ["absent", "stopped", "running"]}, "profileId": {"type": "string", "pattern": "^[a-z0-9][a-z0-9-]{0,63}$"}, "memoryMiB": {"type": "integer", "minimum": 256, "maximum": 16384}, "vcpus": {"type": "integer", "minimum": 1, "maximum": 16}, "dataDiskGiB": {"type": "integer", "minimum": 1, "maximum": 1024}}},
      "ApplyVm": {"type": "object", "additionalProperties": false, "required": ["generation", "desiredState", "profileId", "resources", "dataDisk"], "properties": {"generation": {"type": "integer", "minimum": 1}, "desiredState": {"enum": ["absent", "stopped", "running"]}, "profileId": {"type": "string", "pattern": "^[a-z0-9][a-z0-9-]{0,63}$"}, "resources": {"type": "object", "additionalProperties": false, "required": ["memoryMiB", "vcpus"], "properties": {"memoryMiB": {"type": "integer", "minimum": 256, "maximum": 16384}, "vcpus": {"type": "integer", "minimum": 1, "maximum": 16}}}, "dataDisk": {"type": "object", "additionalProperties": false, "required": ["sizeGiB", "preserveOnDelete"], "properties": {"sizeGiB": {"type": "integer", "minimum": 1, "maximum": 1024}, "preserveOnDelete": {"type": "boolean"}}}}},
      "Operation": {"type": "object", "additionalProperties": false, "required": ["id", "state", "currentStepId", "errorCode"], "properties": {"id": {"type": "string", "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$"}, "state": {"enum": ["ACCEPTED", "PREFLIGHT", "FETCHING", "VERIFYING", "PREPARING_DISKS", "PREPARING_BOOT", "STARTING_QEMU", "WAITING_FOR_QMP", "BOOTSTRAPPING_GUEST", "WAITING_FOR_SSH", "WAITING_FOR_GUEST_MESH", "SUCCEEDED", "WAITING_FOR_USER", "FAILED_RETRYABLE", "FAILED_PERMANENT", "CANCELLING", "CANCELLED", "ROLLING_BACK", "ROLLED_BACK"]}, "currentStepId": {"type": ["string", "null"], "pattern": "^[a-z][a-z0-9_.-]{0,127}$"}, "errorCode": {"type": ["string", "null"], "pattern": "^[A-Z][A-Z0-9_]{0,63}$"}}},
      "Diagnostics": {"type": "object", "additionalProperties": false, "required": ["generatedAtEpochMs", "entries"], "properties": {"generatedAtEpochMs": {"type": "integer", "minimum": 0}, "entries": {"type": "object", "maxProperties": 128, "propertyNames": {"maxLength": 64}, "additionalProperties": {"type": "string", "maxLength": 512}}}}
    }
  }
}
