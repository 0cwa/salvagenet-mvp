name: provenance

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate deterministic provenance report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/provenance/report.sh "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/provenance-report.json"

      - name: Upload provenance report
        uses: actions/upload-artifact@v4
        with:
          name: provenance-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/provenance-report.json
