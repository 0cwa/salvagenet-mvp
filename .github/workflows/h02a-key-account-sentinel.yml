name: h02a-key-account-sentinel

on:
  push:
    branches:
      - automation/H02A-key-account-sentinel

permissions:
  contents: write

env:
  EXPECTED_HEAD: 3e4840dd7990168a2ff0c23e429ca7279fd778a2
  TARGET_BRANCH: agent/H02A-runtime-qualification
  CONTROL_BRANCH: automation/H02A-key-account-sentinel

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ env.CONTROL_BRANCH }}
          path: control
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: source
      - name: Apply, validate, and record
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/h02a-key-account-sentinel.log"
          set +e
          (
            set -euo pipefail
            cd source
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
            python3 - <<'PY'
          from pathlib import Path

          def once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          once(
              'lab/qemu/scripts/h02a-prepare.py',
              '''    lock_passwd: true
              ssh_authorized_keys:
          ''',
              '''    lock_passwd: false
              hashed_passwd: "NP"
              ssh_authorized_keys:
          ''',
              'test-only account sentinel',
          )
          once(
              'lab/qemu/scripts/h02a-prepare.py',
              '''            "earlySshKey": True,
              "sha256": sha256_file(user),
          ''',
              '''            "earlySshKey": True,
              "qualificationAccountPassword": "unlocked-non-authenticating-NP-sentinel",
              "sha256": sha256_file(user),
          ''',
              'preflight account sentinel',
          )
          once(
              'lab/qemu/scripts/h02a-evidence.py',
              '''        or user.get("earlySshKey") is not True
              or user.get("qualificationSudo") != "nodeadmin-nopasswd-test-only"
          ''',
              '''        or user.get("earlySshKey") is not True
              or user.get("qualificationAccountPassword") != "unlocked-non-authenticating-NP-sentinel"
              or user.get("qualificationSudo") != "nodeadmin-nopasswd-test-only"
          ''',
              'evidence account sentinel',
          )
          once(
              'tests/guest/test_h02a_lab.py',
              '''            "lock_passwd: true",
              "ssh_authorized_keys:",
          ''',
              '''            "lock_passwd: false",
              'hashed_passwd: "NP"',
              "ssh_authorized_keys:",
          ''',
              'multipart account test',
          )
          once(
              'tests/guest/test_h02a_lab.py',
              '''        self.assertIn('"earlySshKey": True', helper)
              self.assertIn('"qualificationSudo": "nodeadmin-nopasswd-test-only"', helper)
          ''',
              '''        self.assertIn('"earlySshKey": True', helper)
              self.assertIn('"qualificationAccountPassword": "unlocked-non-authenticating-NP-sentinel"', helper)
              self.assertIn('"qualificationSudo": "nodeadmin-nopasswd-test-only"', helper)
          ''',
              'source account contract test',
          )
          once(
              'tests/guest/test_h02a_evidence.py',
              '''                "earlySshKey": True,
              "sha256": "3" * 64,
          ''',
              '''                "earlySshKey": True,
              "qualificationAccountPassword": "unlocked-non-authenticating-NP-sentinel",
              "sha256": "3" * 64,
          ''',
              'evidence fixture sentinel',
          )
          marker = '''    def test_finalize_requires_exact_cleanup_and_verified_base(self) -> None:
          '''
          test = '''    def test_missing_non_authenticating_account_sentinel_is_rejected(self) -> None:
              value = json.loads((self.state / "preflight.json").read_text(encoding="utf-8"))
              value["testUserData"].pop("qualificationAccountPassword")
              (self.state / "preflight.json").write_text(json.dumps(value), encoding="utf-8")
              with self.assertRaisesRegex(evidence.EvidenceError, "user-data contract"):
                  evidence.create_evidence(self.state)

              def test_finalize_requires_exact_cleanup_and_verified_base(self) -> None:
          '''
          once('tests/guest/test_h02a_evidence.py', marker, test, 'missing sentinel evidence test')
          PY
            python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/guest/test_h02a_evidence.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith('    def test_missing_non_authenticating_account_sentinel'))
          end = next(i for i in range(start + 1, len(lines)) if lines[i].startswith('    def test_symlinked_evidence_path'))
          # The workflow YAML removes four spaces from embedded Python. Restore
          # the two method bodies and the following existing method definition.
          for i in range(start + 1, end):
              if lines[i].startswith('    def test_finalize_requires_exact_cleanup'):
                  lines[i] = lines[i].replace('    def ', 'def ', 1)
              elif lines[i]:
                  lines[i] = '    ' + lines[i]
          # Restore the existing method definition to class indentation.
          idx = next(i for i in range(start + 1, end) if lines[i].startswith('def test_finalize_requires_exact_cleanup'))
          lines[idx] = '    ' + lines[idx]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
            make validate
            make test-guest
            python3 tools/agents/verify-scope.py H02A
          ) 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          new_head="$EXPECTED_HEAD"
          if [[ $rc -eq 0 ]]; then
            cd source
            expected=(
              lab/qemu/scripts/h02a-evidence.py
              lab/qemu/scripts/h02a-prepare.py
              tests/guest/test_h02a_evidence.py
              tests/guest/test_h02a_lab.py
            )
            mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
            mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
            diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${changed[@]}")
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "${expected[@]}"
            git commit -m 'lab(H02A): keep qualification account key-accessible'
            git push origin "HEAD:$TARGET_BRANCH"
            new_head=$(git rev-parse HEAD)
            cd ..
          fi
          python3 - "$log" "$rc" "$new_head" <<'PY'
          from pathlib import Path
          import json, sys
          target = Path('control/automation/h02a-key-account-sentinel-result.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({
              'schemaVersion': 1,
              'exitCode': int(sys.argv[2]),
              'productHead': sys.argv[3],
              'logTail': Path(sys.argv[1]).read_bytes()[-32768:].decode('utf-8', 'replace'),
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git -C control config user.name 'github-actions[bot]'
          git -C control config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C control add automation/h02a-key-account-sentinel-result.json
          git -C control commit -m 'automation: record H02A account-sentinel result'
          git -C control push origin "HEAD:$CONTROL_BRANCH"
          exit "$rc"
