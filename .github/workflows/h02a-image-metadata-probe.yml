name: h02a-image-metadata-probe

on:
  push:
    branches:
      - research/H02A-ubuntu-image-metadata

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Inspect immutable Ubuntu ARM64 release image
        shell: bash
        run: |
          set -euo pipefail
          base='https://cloud-images.ubuntu.com/releases/noble/release-20260725'
          image='ubuntu-24.04-server-cloudimg-arm64.img'
          headers="$(curl --fail --silent --show-error --location --head \
            --proto '=https' --tlsv1.2 --connect-timeout 30 --max-time 120 \
            "$base/$image")"
          printf '%s\n' "$headers"
          size="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^content-length:/ {gsub("\\r",""); value=$2} END{print value}')"
          test -n "$size"
          sums="$(curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --connect-timeout 30 --max-time 120 \
            "$base/SHA256SUMS")"
          digest="$(printf '%s\n' "$sums" | awk -v name="$image" '$2 == "*" name {print $1}')"
          test -n "$digest"
          mkdir -p research
          cat > research/h02a-image-metadata.json <<EOF
          {
            "url": "$base/$image",
            "sizeBytes": $size,
            "sha256": "$digest"
          }
          EOF
          cat research/h02a-image-metadata.json
      - name: Record probe result on the isolated research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/h02a-image-metadata.json
          git commit -m 'research: record immutable Ubuntu image metadata'
          git push
