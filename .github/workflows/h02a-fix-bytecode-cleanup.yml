name: h02a-fix-bytecode-cleanup

on:
  push:
    branches:
      - automation/H02A-early-ssh-key

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: automation/H02A-early-ssh-key
      - name: Insert bytecode cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/h02a-apply-early-key.yml')
          text = path.read_text(encoding='utf-8')
          cleanup = "            find . -type d -name __pycache__ -prune -exec rm -rf {} +\n"
          if cleanup not in text:
              marker = "              tests/guest/test_h02a_shell.py\n            make validate\n"
              if text.count(marker) != 1:
                  raise SystemExit('bytecode cleanup marker differs')
              text = text.replace(
                  marker,
                  "              tests/guest/test_h02a_shell.py\n" + cleanup + "            make validate\n",
                  1,
              )
              path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/h02a-apply-early-key.yml
          git commit -m 'automation: clean bytecode before H02A validation'
          git push origin HEAD:automation/H02A-early-ssh-key
