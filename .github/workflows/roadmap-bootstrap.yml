name: roadmap-bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run or intentionally apply the reviewed bootstrap
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      expected_main:
        description: Exact current main commit required for apply
        required: false
        type: string
  issues:
    types: [opened]

concurrency:
  group: roadmap-bootstrap
  cancel-in-progress: false

permissions: {}

jobs:
  dry-run:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reviewed seed
        run: python3 tools/roadmap/commands.py validate-seed
      - name: Plan live bootstrap without mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/roadmap/commands.py bootstrap

  apply:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply') ||
      (github.event_name == 'issues' &&
       github.event.issue.title == '[Roadmap Apply] Bootstrap reviewed graph' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_ISSUE: ${{ github.event.issue.number || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify explicit exact-main request
        env:
          DISPATCH_EXPECTED: ${{ inputs.expected_main || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
        run: |
          set -euo pipefail
          expected="$DISPATCH_EXPECTED"
          if [[ -z "$expected" ]]; then
            expected="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^expected-main:[[:space:]]*//p' | head -n1)"
          fi
          actual="$(git rev-parse HEAD)"
          if [[ -z "$expected" || "$expected" != "$actual" ]]; then
            echo "Roadmap apply requires expected-main: $actual; received: ${expected:-<empty>}" >&2
            exit 2
          fi
          echo "ROADMAP_SOURCE_COMMIT=$actual" >> "$GITHUB_ENV"
      - name: Validate reviewed seed and focused tests
        run: |
          python3 tools/roadmap/commands.py validate-seed
          python3 -m unittest discover -s tests/tools -p 'test_roadmap*.py'
      - name: Apply labels, milestones, issues, and dependencies
        run: |
          python3 tools/roadmap/commands.py bootstrap --apply \
            --state-output .github/roadmap/bootstrap-state.v1.json \
            | tee .local-roadmap-apply.json
      - name: Generate complete live snapshots
        run: python3 tools/roadmap/sync.py --write --strict-live
      - name: Re-run as non-destructive verification
        run: |
          python3 tools/roadmap/commands.py bootstrap > .local-roadmap-rerun.json
          python3 tools/roadmap/sync.py --strict-live
      - name: Commit generated bootstrap state and snapshots to a review branch
        id: snapshot
        run: |
          set -euo pipefail
          branch="automation/roadmap-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/roadmap/bootstrap-state.v1.json \
            website/data/roadmap.snapshot.v1.json \
            agents/generated/roadmap.index.v1.json
          git commit -m "roadmap: record live bootstrap snapshot"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "### Roadmap bootstrap applied" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`$ROADMAP_SOURCE_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Review branch: \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the human-visible apply request
        if: env.TRIGGER_ISSUE != ''
        env:
          SNAPSHOT_BRANCH: ${{ steps.snapshot.outputs.branch }}
        run: |
          gh issue comment "$TRIGGER_ISSUE" --body "Roadmap bootstrap applied from exact main \`$ROADMAP_SOURCE_COMMIT\`. Review generated state and snapshots on branch \`$SNAPSHOT_BRANCH\`; create and merge a normal PR before treating the committed cache as current."
      - uses: actions/upload-artifact@v4
        with:
          name: roadmap-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local-roadmap-apply.json
            .local-roadmap-rerun.json
            .github/roadmap/bootstrap-state.v1.json
            website/data/roadmap.snapshot.v1.json
            agents/generated/roadmap.index.v1.json
          if-no-files-found: error
          retention-days: 14
