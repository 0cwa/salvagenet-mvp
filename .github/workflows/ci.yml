name: nodehost-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate agent scaffold and contracts
        run: make validate

  android-after-import:
    if: ${{ hashFiles('android/podroid/gradlew') != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018'
      - name: Pure/domain tests
        run: make test-jvm
      - name: Android adapter tests and lint
        run: make test-android
