name: nodehost-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: nodehost-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate repository, contracts, evidence, and generated status
        run: make validate
      - name: Guest/profile qualification tests
        run: make test-guest

  android:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: android-actions/setup-android@v3
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install pinned Android components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018'
      - name: Verify selected toolchains
        shell: bash
        run: |
          java -version
          test "$(go env GOVERSION)" = 'go1.26.3'
          sdkmanager --list_installed
      - name: Repository validation
        run: make validate
      - name: Pure/domain tests
        run: make test-jvm
      - name: Android adapter tests and lint
        run: make test-android
      - name: Guest/profile qualification tests
        run: make test-guest
      - name: Build and verify packaged candidate
        working-directory: android/podroid
        run: ./gradlew :app:assembleDebug :mesh-tailscale:assembleRelease :app:verifyPodroidPackaging
      - name: Verify APK signature, 16 KiB alignment, and identity
        shell: bash
        run: |
          apk=android/podroid/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          sha256sum "$apk" | tee nodehost-debug.sha256
          python3 - <<'PY'
          import json, os, pathlib
          sha_line = pathlib.Path('nodehost-debug.sha256').read_text().strip()
          apk = pathlib.Path('android/podroid/app/build/outputs/apk/debug/app-debug.apk')
          size = apk.stat().st_size
          evidence = {
              'schemaVersion': 1,
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'artifact': 'android/podroid/app/build/outputs/apk/debug/app-debug.apk',
              'sha256': sha_line.split()[0],
              'sizeBytes': size,
              'signatureVerified': True,
              'alignment16KiBVerified': True,
              'hardwareValidated': False,
          }
          pathlib.Path('release-candidate-evidence.json').write_text(json.dumps(evidence, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nodehost-device-lab-candidate-${{ env.SOURCE_COMMIT }}
          if-no-files-found: error
          retention-days: 14
          path: |
            android/podroid/app/build/outputs/apk/debug/app-debug.apk
            nodehost-debug.sha256
            release-candidate-evidence.json
